layout: default
---

<style type="text/css" media="screen">
  .container {
    margin: 10px auto;
    max-width: 600px;
    text-align: center;
  }
  h1 {
    margin: 30px 0;
    font-size: 4em;
    line-height: 1;
    letter-spacing: -1px;
  }
  .smiley {
    display: inline-block;
    color: inherit;
    transition: color 0.15s ease, text-shadow 0.15s ease, transform 0.15s ease;
  }
  .smiley.is-winking {
    color: #ff5a36;
    text-shadow: 0 0 10px rgba(255, 90, 54, 0.9);
  }
  .smiley.is-glitching {
    animation: smiley-glitch 0.24s steps(2, end) 1;
    color: #7eecd6;
    text-shadow: -2px 0 #ff3b6b, 2px 0 #42d4ff;
  }
  @keyframes smiley-glitch {
    0% {
      transform: translateX(0);
    }
    20% {
      transform: translateX(-1px) skewX(8deg);
    }
    40% {
      transform: translateX(2px) skewX(-10deg);
    }
    60% {
      transform: translateX(-2px);
    }
    80% {
      transform: translateX(1px) skewX(4deg);
    }
    100% {
      transform: translateX(0);
    }
  }
</style>

<div class="container">
  <h1>404</h1>

  <!-- They left bronze suns so the line would never be forgotten -->
  <!-- The line ends where the hill begins.
  A painter once watched Paris from there. -->
  <p><strong>Page not found <span class="smiley" data-arago=true>:(</span></strong></p>
  <p>The requested page could not be found.</p>
</div>

<script>
  const smiley = document.querySelector("[data-arago='true']");

  function triggerGlitch() {
    if (!smiley) {
      return;
    }

    smiley.classList.remove("is-glitching");
    void smiley.offsetWidth;
    smiley.classList.add("is-glitching");

    window.setTimeout(function () {
      smiley.classList.remove("is-glitching");
    }, 240);
  }

  function triggerWink() {
    if (!smiley) {
      return;
    }

    smiley.classList.remove("is-glitching");
    smiley.textContent = ";)";
    smiley.classList.add("is-winking");

    window.setTimeout(function () {
      smiley.textContent = ":(";
      smiley.classList.remove("is-winking");
    }, 1000);
  }

  if (smiley) {
    const interactionHintShown = false;

    function showInteractionHint() {
      if (interactionHintShown) {
        return;
      }

      interactionHintShown = true;
      triggerGlitch();
    }

    window.addEventListener("pointermove", showInteractionHint, { once: true, passive: true });
    window.addEventListener("touchstart", showInteractionHint, { once: true, passive: true });
  }

  window.setTimeout(function () {
    if (!smiley) {
      return;
    }

    triggerWink();
  }, 5000);
</script>
